name: Python Tests

on:
  push:
    branches: [ main, copilot/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      working-directory: ./python-calculator
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      working-directory: ./python-calculator
      run: |
        PYTHONPATH=. pytest tests/ -v --cov=calculator --cov-report=term-missing
    
    - name: Test calculator execution
      working-directory: ./python-calculator
      run: |
        echo "quit" | python calculator.py || true
